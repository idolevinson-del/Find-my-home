name: hunt
# Runs one scan in GitHub's cloud: Telegram taps/commands → Yad2 → filters →
# score → Telegram alerts, then rebuilds the dashboard site (GitHub Pages).
# The database (which listings were already seen/sent) lives on the `bot-state`
# branch between runs, so nothing is ever sent twice.
#
# Schedule: every 10 minutes (public repo → no Actions minutes limit).
# GitHub's cron is best-effort (it can be delayed or skipped for a long time),
# so each run on main also starts the next one ~10 minutes later (`next` job).
# The concurrency group keeps at most one run going and one waiting, so extra
# triggers (cron + chain) collapse instead of piling up.
# To stop everything: Actions → hunt → "…" → Disable workflow.
#
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (required), GEMINI_API_KEY (optional).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}     # "Run workflow" button = scan now
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/hunt.yml"]

permissions:
  contents: write           # to save the DB on the bot-state branch
  pages: write              # to publish the dashboard
  id-token: write
  actions: write            # to start the next run

concurrency:
  group: hunt               # never two scans at once
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore database
        run: |
          mkdir -p data
          if git fetch --depth 1 origin bot-state 2>/dev/null; then
            git show FETCH_HEAD:hunter.db > data/hunter.db && echo "Restored database"
          else
            echo "No bot-state branch yet — first run"
          fi

      - name: Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m app.cli scan

      - name: Save database
        if: always()
        run: |
          [ -f data/hunter.db ] || exit 0
          rm -rf ../state && mkdir ../state && cd ../state
          git init -q -b bot-state
          git config user.name "find-my-home-bot"
          git config user.email "find-my-home-bot@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/data/hunter.db" .
          git add hunter.db
          git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bot-state
          echo "Database saved"

      - name: Build dashboard
        if: always() && github.ref == 'refs/heads/main'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m app.cli build-site site

      - uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    # Publishes the dashboard to https://<user>.github.io/<repo>/ .
    # Needs Settings → Pages → Source: "GitHub Actions" (one-time).
    needs: scan
    if: always() && github.ref == 'refs/heads/main' && needs.scan.result != 'skipped'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  next:
    # Keeps the 10-minute rhythm even when GitHub's cron doesn't fire.
    needs: [scan, deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Wait, then start the next scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 450
          gh workflow run hunt.yml --repo "${{ github.repository }}" --ref main
